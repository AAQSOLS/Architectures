name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality:
    name: Backend Build & Test (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ModularSaaS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ModularSaaS.slnx

      - name: Build with warnings as errors
        run: dotnet build ModularSaaS.slnx --no-restore --configuration Release --warnaserror

      - name: Run tests
        run: dotnet test ModularSaaS.slnx --no-build --configuration Release --verbosity normal

  frontend-quality:
    name: Frontend Quality & Build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ModularSaaS/apps/Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: ModularSaaS/apps/Web/package.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Formatting (Prettier)
        run: npm run format:check

      - name: Run ESLint & Boundary Rules (Zero Warnings)
        run: npm run lint

      - name: TypeScript Strict Type Check
        run: npm run typecheck

      - name: Build Application (Verify Budgets)
        run: npm run build
